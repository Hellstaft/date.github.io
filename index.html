<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приглашение на свидание ❤️</title>
    <style>
        /* Базовые стили */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #fdfcfb 0%, #e2d1c3 100%);
            font-family: 'Georgia', serif;
            padding: 20px;
            margin: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            padding: 35px 25px 40px 25px;
            border-radius: 45px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        /* Текст */
        .hearts-top {
            font-size: 2.2rem;
            letter-spacing: 10px;
            margin-bottom: 5px;
        }

        .invite-text {
            font-size: 1.7rem;
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.4;
            margin-bottom: 5px;
        }

        .invite-text .highlight {
            background: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-text {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 20px;
            font-style: italic;
        }

        /* Картинка */
        .image-container {
            width: 100%;
            margin: 15px 0 25px 0;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Блок с кнопками */
        .buttons-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 10px;
            min-height: 80px;
            transition: all 0.2s ease;
        }

        /* Обе кнопки */
        .btn {
            padding: 16px 35px;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.5px;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Кнопка ДА */
        .btn-yes {
            background: #2ecc71;
            color: white;
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
            flex-shrink: 0;
        }
        .btn-yes:hover {
            background: #27ae60;
            transform: scale(1.05);
        }
        .btn-yes:active {
            transform: scale(0.95);
        }

        /* Кнопка НЕТ (будет меняться) */
        .btn-no {
            background: #e74c3c;
            color: white;
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
            flex-shrink: 0;
            position: relative;
            transition: all 0.15s ease;
        }
        .btn-no:hover {
            background: #c0392b;
        }
        .btn-no:active {
            transform: scale(0.9);
        }

        /* Контейнер для плавающих грустных смайлов */
        .sad-emoji-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .sad-emoji {
            position: absolute;
            font-size: 2.5rem;
            animation: floatUp 2.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.5) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-250px) scale(1.3) rotate(30deg);
            }
        }

        /* Стили для модального окна (затычка для "Да") */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: white;
            padding: 40px 30px;
            border-radius: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: popIn 0.5s ease;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-box h2 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .modal-box p {
            color: #555;
            font-size: 1.2rem;
            line-height: 1.6;
        }
        .modal-box .big-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 15px;
        }
        .modal-close-btn {
            margin-top: 20px;
            padding: 12px 40px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: 'Georgia', serif;
            transition: 0.3s;
        }
        .modal-close-btn:hover {
            background: #2980b9;
            transform: scale(1.05);
        }
        .modal-close-btn:active {
            transform: scale(0.95);
        }

        /* Адаптация для телефонов */
        @media (max-width: 500px) {
            .card {
                padding: 25px 18px 30px 18px;
            }
            .invite-text {
                font-size: 1.4rem;
            }
            .sub-text {
                font-size: 1rem;
            }
            .btn {
                padding: 14px 25px;
                font-size: 1rem;
                min-width: 120px;
            }
            .buttons-wrapper {
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <div class="hearts-top">❤️‍🔥</div>

        <p class="invite-text">
            Приглашаю тебя на свидание <br>
            по поводу нашей <span class="highlight">6-ой годовщины</span>.
        </p>

        <p class="sub-text">Ты согласен? 🥺</p>

        <!-- ТВОЯ КАРТИНКА -->
        <div class="image-container">
            <img src="date.jpg" alt="Наше фото">
        </div>

        <!-- КНОПКИ -->
        <div class="buttons-wrapper" id="buttonWrapper">
            <button class="btn btn-yes" id="yesBtn">Да, я согласен! ❤️</button>
            <button class="btn btn-no" id="noBtn">Нет..... 😢</button>
        </div>

        <p style="margin-top: 20px; font-size: 0.8rem; color: #aaa;">(Нажми "Нет" несколько раз 😏)</p>
    </div>

    <!-- Модальное окно (затычка для "Да") -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <span class="big-emoji">🎉</span>
            <h2>Я знала! ❤️</h2>
            <p>
                <strong>Ты сделал меня самой счастливой!</strong><br><br>
                📍 <em>Адрес и время скоро будут здесь...</em><br>
                (А пока просто знай, что я тебя очень люблю! 💕)
            </p>
            <button class="modal-close-btn" id="modalCloseBtn">Закрыть и обнять 😊</button>
        </div>
    </div>

    <!-- Контейнер для вылетающих смайлов -->
    <div class="sad-emoji-container" id="sadEmojiContainer"></div>

    <script>
        // --- ЛОГИКА ДЛЯ КНОПКИ "НЕТ" (ДЛЯ ТЕЛЕФОНА И ПК) ---
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const wrapper = document.getElementById('buttonWrapper');

        // Массив грустных смайлов
        const sadEmojis = ['😢', '😭', '🥺', '💔', '😩', '😿', '💧', '😞', '💦'];

        // Функция для создания летающих смайлов
        function createFlyingEmoji() {
            const container = document.getElementById('sadEmojiContainer');
            const emoji = document.createElement('div');
            emoji.classList.add('sad-emoji');

            // Случайный смайл
            const randomEmoji = sadEmojis[Math.floor(Math.random() * sadEmojis.length)];
            emoji.textContent = randomEmoji;

            // Случайное положение по горизонтали (от 5% до 95%)
            const leftPos = 5 + Math.random() * 90;
            emoji.style.left = leftPos + '%';

            // Случайный размер
            const size = 1.5 + Math.random() * 2;
            emoji.style.fontSize = size + 'rem';

            // Случайная задержка (чтобы не все сразу)
            emoji.style.animationDelay = Math.random() * 0.3 + 's';

            container.appendChild(emoji);

            // Удаляем элемент после анимации
            setTimeout(() => {
                emoji.remove();
            }, 3000);
        }

        // Счетчик нажатий на "Нет"
        let noClicks = 0;

        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            noClicks++;

            // 1. Вылетают грустные смайлы
            for (let i = 0; i < 3; i++) {
                setTimeout(createFlyingEmoji, i * 100);
            }

            // 2. Кнопка "Нет" уменьшается и бледнеет
            const currentScale = Math.max(0.5, 1 - noClicks * 0.08);
            const currentOpacity = Math.max(0.3, 1 - noClicks * 0.07);
            noBtn.style.transform = `scale(${currentScale})`;
            noBtn.style.opacity = currentOpacity;

            // 3. Кнопка "Да" становится больше и ярче (чтобы дразнить)
            const yesScale = 1 + noClicks * 0.04;
            yesBtn.style.transform = `scale(${Math.min(yesScale, 1.4)})`;
            yesBtn.style.boxShadow = `0 0 30px rgba(46, 204, 113, ${Math.min(0.3 + noClicks * 0.05, 0.8)})`;

            // 4. Если нажали 8 раз — кнопка "Нет" почти исчезает, оставляем только "Да"
            if (noClicks >= 8) {
                noBtn.style.transform = 'scale(0.1)';
                noBtn.style.opacity = '0';
                noBtn.style.pointerEvents = 'none'; // Чтобы нельзя было нажать
                // Последний смайл-прощанка
                setTimeout(() => {
                    const finalEmoji = document.createElement('div');
                    finalEmoji.classList.add('sad-emoji');
                    finalEmoji.textContent = '😘';
                    finalEmoji.style.fontSize = '4rem';
                    finalEmoji.style.left = '50%';
                    finalEmoji.style.top = '50%';
                    finalEmoji.style.transform = 'translate(-50%, -50%)';
                    document.getElementById('sadEmojiContainer').appendChild(finalEmoji);
                    setTimeout(() => finalEmoji.remove(), 3000);
                }, 300);
            }

            // Вибрация на телефоне (если поддерживается)
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }
        });

        // --- ЛОГИКА ДЛЯ КНОПКИ "ДА" (ПОКАЗЫВАЕТ МОДАЛКУ) ---
        const modalOverlay = document.getElementById('modalOverlay');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        yesBtn.addEventListener('click', function(e) {
            e.preventDefault();
            modalOverlay.classList.add('active');
            // Вибрация радости
            if (navigator.vibrate) {
                navigator.vibrate([50, 100, 50]);
            }
        });

        // Закрытие модалки
        modalCloseBtn.addEventListener('click', function() {
            modalOverlay.classList.remove('active');
        });

        // Закрытие по клику вне модалки
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        // Сброс состояния кнопки "Нет" (на всякий случай, если обновят страницу)
        // Но мы хотим, чтобы при обновлении всё было заново, так что оставляем как есть.
        console.log('❤️ Приглашение готово! Надеюсь, он скажет ДА!');
    </script>

</body>
</html>
