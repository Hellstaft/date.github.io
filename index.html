<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приглашение на свидание ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #ffecd2 0%, #fcb69f 100%);
            font-family: 'Georgia', serif;
            padding: 20px;
            margin: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            padding: 35px 25px 40px 25px;
            border-radius: 45px;
            box-shadow: 0 30px 60px rgba(231, 76, 60, 0.2);
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 2px solid rgba(255, 107, 107, 0.3);
            transition: 0.3s;
            position: relative;
        }

        /* Цветные акценты */
        .hearts-top {
            font-size: 2.5rem;
            letter-spacing: 12px;
            margin-bottom: 5px;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .invite-text {
            font-size: 1.7rem;
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.4;
            margin-bottom: 5px;
        }

        .invite-text .highlight {
            background: linear-gradient(120deg, #f093fb 0%, #f5576c 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .sub-text {
            font-size: 1.2rem;
            color: #e74c3c;
            margin-bottom: 20px;
            font-weight: 600;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .image-container {
            width: 100%;
            margin: 15px 0 25px 0;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.2);
            border: 3px solid rgba(255, 107, 107, 0.3);
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .buttons-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 10px;
            min-height: 80px;
            transition: all 0.2s ease;
        }

        .btn {
            padding: 16px 35px;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.5px;
        }

        /* Кнопка ДА - яркая зеленая с неоном */
        .btn-yes {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(56, 239, 125, 0.4);
            flex-shrink: 0;
        }
        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(56, 239, 125, 0.6);
        }
        .btn-yes:active {
            transform: scale(0.95);
        }

        /* Кнопка НЕТ - яркая красная */
        .btn-no {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
            flex-shrink: 0;
            position: relative;
            transition: all 0.15s ease;
        }
        .btn-no:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(245, 87, 108, 0.6);
        }
        .btn-no:active {
            transform: scale(0.9);
        }

        /* Контейнер для смайлов (привязан к кнопке Нет) */
        .sad-emoji-container {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            overflow: visible;
        }

        .sad-emoji {
            position: absolute;
            font-size: 2.5rem;
            animation: floatUp 2.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.3) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-350px) scale(1.5) rotate(30deg);
            }
        }

        /* Модальное окно (затычка для "Да") - яркое */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: linear-gradient(135deg, #fff5f5 0%, #ffe8e8 100%);
            padding: 40px 30px;
            border-radius: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: popIn 0.6s ease;
            box-shadow: 0 30px 60px rgba(231, 76, 60, 0.3);
            border: 2px solid rgba(255, 107, 107, 0.3);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5) rotate(-5deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .modal-box h2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .modal-box p {
            color: #2c3e50;
            font-size: 1.2rem;
            line-height: 1.8;
        }
        .modal-box .big-emoji {
            font-size: 4.5rem;
            display: block;
            margin-bottom: 10px;
            animation: sparkle 1.5s ease-in-out infinite;
        }
        .modal-close-btn {
            margin-top: 20px;
            padding: 14px 45px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: 'Georgia', serif;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(56, 239, 125, 0.4);
        }
        .modal-close-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(56, 239, 125, 0.6);
        }
        .modal-close-btn:active {
            transform: scale(0.95);
        }

        /* Адаптация для телефонов */
        @media (max-width: 500px) {
            .card {
                padding: 25px 18px 30px 18px;
            }
            .invite-text {
                font-size: 1.4rem;
            }
            .sub-text {
                font-size: 1rem;
            }
            .btn {
                padding: 14px 25px;
                font-size: 1rem;
                min-width: 120px;
            }
            .buttons-wrapper {
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <div class="hearts-top">❤️‍🔥💖💕</div>

        <p class="invite-text">
            Приглашаю тебя на свидание <br>
            по поводу нашей <span class="highlight">6-ой годовщины</span>.
        </p>

        <p class="sub-text">Ты согласен? 🥺</p>

        <!-- ТВОЯ КАРТИНКА -->
        <div class="image-container">
            <img src="date.jpg" alt="Наше фото">
        </div>

        <!-- КНОПКИ -->
        <div class="buttons-wrapper" id="buttonWrapper">
            <button class="btn btn-yes" id="yesBtn">Да, я согласен! ❤️</button>
            <button class="btn btn-no" id="noBtn">Нет..... 😢</button>
        </div>

    </div>

    <!-- Модальное окно (затычка для "Да") -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <span class="big-emoji">🎉❤️‍🔥</span>
            <h2>Я знала! 💕</h2>
            <p>
                <strong>Ты сделал меня самой счастливой!</strong><br><br>
                📍 <em>Адрес и время скоро будут здесь...</em><br>
                (А пока просто знай, что я тебя очень люблю! 💖)
            </p>
            <button class="modal-close-btn" id="modalCloseBtn">Обнять тебя! 🤗</button>
        </div>
    </div>

    <script>
        // --- ЛОГИКА ДЛЯ КНОПКИ "НЕТ" ---
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const wrapper = document.getElementById('buttonWrapper');

        // Массив грустных смайлов (без 💦)
        const sadEmojis = ['😢', '😭', '🥺', '💔', '😩', '😿', '😞', '💧'];

        // Функция создания смайлов, которые вылетают ИЗ-ПОД КНОПКИ
        function createFlyingEmoji(btnElement) {
            const container = document.getElementById('sadEmojiContainer');
            
            // Получаем координаты кнопки
            const rect = btnElement.getBoundingClientRect();
            
            // Создаём контейнер, если его нет
            if (!container) {
                const newContainer = document.createElement('div');
                newContainer.id = 'sadEmojiContainer';
                newContainer.className = 'sad-emoji-container';
                document.body.appendChild(newContainer);
            }

            const currentContainer = document.getElementById('sadEmojiContainer');
            
            // Позиционируем контейнер над кнопкой
            currentContainer.style.left = '0';
            currentContainer.style.top = '0';
            currentContainer.style.width = '100%';
            currentContainer.style.height = '100%';

            const emoji = document.createElement('div');
            emoji.classList.add('sad-emoji');

            const randomEmoji = sadEmojis[Math.floor(Math.random() * sadEmojis.length)];
            emoji.textContent = randomEmoji;

            // Стартуем из центра кнопки
            const x = rect.left + rect.width / 2 - 25;
            const y = rect.top - 10;

            emoji.style.left = x + 'px';
            emoji.style.top = y + 'px';

            // Случайное смещение в стороны
            const offsetX = (Math.random() - 0.5) * 120;
            const offsetY = -30 - Math.random() * 50;
            emoji.style.setProperty('--offset-x', offsetX + 'px');
            emoji.style.setProperty('--offset-y', offsetY + 'px');

            // Случайный размер
            const size = 2 + Math.random() * 1.5;
            emoji.style.fontSize = size + 'rem';

            currentContainer.appendChild(emoji);

            setTimeout(() => {
                emoji.remove();
            }, 3000);
        }

        // Счетчик нажатий
        let noClicks = 0;

        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            noClicks++;

            // 1. Вылетают смайлы из-под кнопки
            for (let i = 0; i < 4; i++) {
                setTimeout(() => createFlyingEmoji(noBtn), i * 80);
            }

            // 2. Кнопка "Нет" уменьшается
            const currentScale = Math.max(0.4, 1 - noClicks * 0.09);
            const currentOpacity = Math.max(0.2, 1 - noClicks * 0.08);
            noBtn.style.transform = `scale(${currentScale})`;
            noBtn.style.opacity = currentOpacity;

            // 3. Кнопка "Да" растёт и светится
            const yesScale = 1 + noClicks * 0.05;
            yesBtn.style.transform = `scale(${Math.min(yesScale, 1.5)})`;
            yesBtn.style.boxShadow = `0 0 40px rgba(56, 239, 125, ${Math.min(0.3 + noClicks * 0.06, 0.9)})`;

            // 4. Если нажали 7 раз — кнопка "Нет" исчезает
            if (noClicks >= 7) {
                noBtn.style.transform = 'scale(0)';
                noBtn.style.opacity = '0';
                noBtn.style.pointerEvents = 'none';
                
                // Финальный смайл
                setTimeout(() => {
                    const finalEmoji = document.createElement('div');
                    finalEmoji.className = 'sad-emoji';
                    finalEmoji.textContent = '❤️';
                    finalEmoji.style.fontSize = '5rem';
                    finalEmoji.style.left = '50%';
                    finalEmoji.style.top = '50%';
                    finalEmoji.style.transform = 'translate(-50%, -50%)';
                    finalEmoji.style.animation = 'floatUp 2.5s ease-out forwards';
                    document.getElementById('sadEmojiContainer').appendChild(finalEmoji);
                    setTimeout(() => finalEmoji.remove(), 3000);
                }, 400);
            }

            // Вибрация
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }
        });

        // --- ЛОГИКА ДЛЯ КНОПКИ "ДА" ---
        const modalOverlay = document.getElementById('modalOverlay');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        yesBtn.addEventListener('click', function(e) {
            e.preventDefault();
            modalOverlay.classList.add('active');
            if (navigator.vibrate) {
                navigator.vibrate([50, 100, 50]);
            }
        });

        modalCloseBtn.addEventListener('click', function() {
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        // Создаём контейнер для смайлов сразу
        const container = document.createElement('div');
        container.id = 'sadEmojiContainer';
        container.className = 'sad-emoji-container';
        document.body.appendChild(container);
    </script>

</body>
</html>
