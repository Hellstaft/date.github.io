<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приглашение на свидание ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #ffecd2 0%, #fcb69f 100%);
            font-family: 'Georgia', serif;
            padding: 20px;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            font-size: 2rem;
            animation: floatHeart 8s ease-in-out infinite;
            opacity: 0.6;
            pointer-events: none;
            transform: none !important;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0.3;
            }
            25% {
                transform: translateY(-30px) translateX(20px) scale(1.1);
                opacity: 0.7;
            }
            50% {
                transform: translateY(-60px) translateX(-10px) scale(0.9);
                opacity: 0.5;
            }
            75% {
                transform: translateY(-30px) translateX(15px) scale(1.05);
                opacity: 0.8;
            }
            100% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0.3;
            }
        }

        @keyframes floatHeartSlow {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0.4;
            }
            33% {
                transform: translateY(-40px) translateX(-15px) scale(1.2);
                opacity: 0.8;
            }
            66% {
                transform: translateY(-20px) translateX(20px) scale(0.8);
                opacity: 0.6;
            }
            100% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0.4;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            padding: 35px 25px 40px 25px;
            border-radius: 45px;
            box-shadow: 0 30px 60px rgba(231, 76, 60, 0.2);
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 2px solid rgba(255, 107, 107, 0.3);
            transition: 0.3s;
            position: relative;
            z-index: 2;
        }

        .hearts-top {
            font-size: 2.5rem;
            letter-spacing: 12px;
            margin-bottom: 5px;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .invite-text {
            font-size: 1.7rem;
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.4;
            margin-bottom: 5px;
        }

        .invite-text .highlight {
            background: linear-gradient(120deg, #f093fb 0%, #f5576c 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .sub-text {
            font-size: 1.2rem;
            color: #e74c3c;
            margin-bottom: 20px;
            font-weight: 600;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .image-container {
            width: 100%;
            margin: 15px 0 25px 0;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.2);
            border: 3px solid rgba(255, 107, 107, 0.3);
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .buttons-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 10px;
            min-height: 80px;
            transition: all 0.2s ease;
        }

        .btn {
            padding: 16px 35px;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.5px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-yes {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(56, 239, 125, 0.4);
            flex-shrink: 0;
        }
        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(56, 239, 125, 0.6);
        }
        .btn-yes:active {
            transform: scale(0.95);
        }

        .btn-no {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
            flex-shrink: 0;
            position: relative;
            transition: all 0.15s ease;
        }
        .btn-no:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(245, 87, 108, 0.6);
        }
        .btn-no:active {
            transform: scale(0.9);
        }

        .sad-emoji-container {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            overflow: visible;
        }

        .sad-emoji {
            position: absolute;
            font-size: 2.5rem;
            animation: floatUp 2.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.3);
            }
            100% {
                opacity: 0;
                transform: translateY(-350px) scale(1.5);
            }
        }

        @media (max-width: 500px) {
            .card {
                padding: 25px 18px 30px 18px;
            }
            .invite-text {
                font-size: 1.4rem;
            }
            .sub-text {
                font-size: 1rem;
            }
            .btn {
                padding: 14px 25px;
                font-size: 1rem;
                min-width: 120px;
            }
            .buttons-wrapper {
                gap: 15px;
            }
            .floating-heart {
                font-size: 1.2rem !important;
                opacity: 0.3 !important;
            }
        }

        @media (min-width: 1200px) {
            .floating-heart {
                font-size: 3rem !important;
            }
        }
    </style>
</head>
<body>

    <div class="hearts-container" id="heartsContainer"></div>

    <div class="card">

        <div class="hearts-top">❤️‍🔥💖💕</div>

        <p class="invite-text">
            Приглашаю тебя на свидание <br>
            по поводу нашей <span class="highlight">6-ой годовщины</span>.
        </p>

        <p class="sub-text">Ты согласен? 🥺</p>

        <div class="image-container">
            <img src="date.jpg" alt="Наше фото">
        </div>

        <div class="buttons-wrapper" id="buttonWrapper">
            <a href="yes.html" class="btn btn-yes" id="yesBtn">Да, я приду! ❤️</a>
            <button class="btn btn-no" id="noBtn">Нет..... 😢</button>
        </div>

    </div>

    <script>
        // =============================================
        // 1. ЛЕТАЮЩИЕ СЕРДЕЧКИ
        // =============================================
        const heartEmojis = ['❤️', '🩷', '❣️', '💕', '💞', '💓', '💗', '💖'];
        const container = document.getElementById('heartsContainer');

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');

            const randomHeart = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.textContent = randomHeart;

            const size = 1.2 + Math.random() * 2.3;
            heart.style.fontSize = size + 'rem';

            const side = Math.random();
            let leftPos;
            if (side < 0.35) {
                leftPos = Math.random() * 15;
            } else if (side < 0.7) {
                leftPos = 85 + Math.random() * 15;
            } else {
                if (Math.random() < 0.5) {
                    leftPos = 20 + Math.random() * 10;
                } else {
                    leftPos = 70 + Math.random() * 10;
                }
            }
            heart.style.left = leftPos + '%';
            heart.style.top = (Math.random() * 100) + '%';

            const delay = Math.random() * 10;
            heart.style.animationDelay = delay + 's';

            const duration = 6 + Math.random() * 8;
            heart.style.animationDuration = duration + 's';

            heart.style.opacity = 0.2 + Math.random() * 0.5;

            const animationType = Math.random() > 0.6 ? 'floatHeartSlow' : 'floatHeart';
            heart.style.animationName = animationType;

            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, (duration + delay) * 1000 + 2000);
        }

        function startHearts() {
            for (let i = 0; i < 18; i++) {
                setTimeout(createFloatingHeart, i * 300);
            }
            setInterval(createFloatingHeart, 1500 + Math.random() * 1000);
        }

        startHearts();

        // =============================================
        // 2. КНОПКА "НЕТ"
        // =============================================
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        const sadEmojis = ['😢', '😭', '🥺', '💔', '😩', '😿', '😞', '💧'];

        function createFlyingEmoji(btnElement) {
            let containerEmoji = document.getElementById('sadEmojiContainer');
            
            if (!containerEmoji) {
                const newContainer = document.createElement('div');
                newContainer.id = 'sadEmojiContainer';
                newContainer.className = 'sad-emoji-container';
                document.body.appendChild(newContainer);
                containerEmoji = newContainer;
            }

            const rect = btnElement.getBoundingClientRect();
            const emoji = document.createElement('div');
            emoji.classList.add('sad-emoji');

            const randomEmoji = sadEmojis[Math.floor(Math.random() * sadEmojis.length)];
            emoji.textContent = randomEmoji;

            const x = rect.left + rect.width / 2 - 25;
            const y = rect.top - 10;

            emoji.style.left = x + 'px';
            emoji.style.top = y + 'px';

            const size = 2 + Math.random() * 1.5;
            emoji.style.fontSize = size + 'rem';

            containerEmoji.appendChild(emoji);

            setTimeout(() => {
                emoji.remove();
            }, 3000);
        }

        let noClicks = 0;

        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            noClicks++;

            for (let i = 0; i < 4; i++) {
                setTimeout(() => createFlyingEmoji(noBtn), i * 80);
            }

            const currentScale = Math.max(0.4, 1 - noClicks * 0.09);
            const currentOpacity = Math.max(0.2, 1 - noClicks * 0.08);
            noBtn.style.transform = `scale(${currentScale})`;
            noBtn.style.opacity = currentOpacity;

            const yesScale = 1 + noClicks * 0.05;
            yesBtn.style.transform = `scale(${Math.min(yesScale, 1.5)})`;
            yesBtn.style.boxShadow = `0 0 40px rgba(56, 239, 125, ${Math.min(0.3 + noClicks * 0.06, 0.9)})`;

            if (noClicks >= 7) {
                noBtn.style.transform = 'scale(0)';
                noBtn.style.opacity = '0';
                noBtn.style.pointerEvents = 'none';
                
                setTimeout(() => {
                    const finalEmoji = document.createElement('div');
                    finalEmoji.className = 'sad-emoji';
                    finalEmoji.textContent = '❤️';
                    finalEmoji.style.fontSize = '5rem';
                    finalEmoji.style.left = '50%';
                    finalEmoji.style.top = '50%';
                    finalEmoji.style.transform = 'translate(-50%, -50%)';
                    finalEmoji.style.animation = 'floatUp 2.5s ease-out forwards';
                    const containerEmoji = document.getElementById('sadEmojiContainer');
                    if (containerEmoji) containerEmoji.appendChild(finalEmoji);
                    setTimeout(() => finalEmoji.remove(), 3000);
                }, 400);
            }

            if (navigator.vibrate) {
                navigator.vibrate(30);
            }
        });

        if (!document.getElementById('sadEmojiContainer')) {
            const containerEmoji = document.createElement('div');
            containerEmoji.id = 'sadEmojiContainer';
            containerEmoji.className = 'sad-emoji-container';
            document.body.appendChild(containerEmoji);
        }
    </script>

</body>
</html>
